<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daymap Server</title>
    <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
</head>
<body>
    <h1>Welcome to Daymap Server</h1>
    <form hx-post="/login" hx-target="#login-result">
        <label for="username">Username:</label>
        <input type="text" id="username" name="sid">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <button type="submit">Login</button>
    </form>
    <div id="login-result"></div>
    <button hx-get="/scrape" hx-target="#displayJson">Scrape</button>
    <div id="displayJson"></div>
</body>
</html>
